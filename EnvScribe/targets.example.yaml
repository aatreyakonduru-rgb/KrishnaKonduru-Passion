# EnvScribe (sample targets). Copy to targets.yaml. Non-secret settings only; credentials come from the environment.
output_dir: ./envscribe-out
sources: []                      # local repo/folder paths to crawl (clone read-only first)
upload_dir: ""                   # default: <output_dir>/uploads
environments: [DEV, SIT, UAT]
prod_opt_in: false
integration_mode: approved-only  # approved-only | auto
approved_integrations: []
max_workers: 4                   # 1..100
token_budget: 0                  # 0 or blank = no limit
on_budget: stop
sweep_mode: redact-rescan-block  # redact-rescan-block | block
aliases: {}                      # payments-api: [payment-svc, PAYHUB]
exclude_sources: []              # path substrings that are never opened (HR, legal)
custom_terms: []

# ---- Analysis features (all optional; defaults shown) ----
disabled_features: []            # any of: ownership, lineage, graph, sbom, scorecards, catalog, drift, contract_diff, readiness, livedocs, gitscan, cloudinv, runtime
scan_git_history: true           # reads commit history of crawled repos for leaked secrets; reports location only, never the value
git_history_max_commits: 2000    # per repo
semantic_search: true            # hybrid (keyword + vector) search in Ask / Impact
vuln_lookup: false               # true sends package names + versions (nothing else) to api.osv.dev
cloud_inventory: []              # any of: aws, gcp, azure, kubernetes. Uses CLIs already logged in on this machine; list/describe/get only
runtime_dir: ""                  # folder with APM service-map exports (JSON/CSV). Blank = <output_dir>/runtime-maps
db_catalogs: []                  # metadata only (schemas, tables, columns); credentials come from the environment, never from this file
#  - {engine: postgres, label: orders-uat, database: orders, schemas: [public]}
#  - {engine: snowflake, label: dwh-uat, database: DWH_UAT}
