# What Devin still needs to learn from the team, one question per item, each tied to the person who can
# answer it, plus the questions about the story a person is working on and the ice-breaker questions asked
# at the start of a session. /learn-more and the dashboard's Learn about who you serve tab read this file.
# Anyone can add a question. Answers are saved only after the person types approved.
story_questions:
  default: On {key} ({summary}), what should Devin know about how that part of the system works today?
  developer: On {key} ({summary}), which screens, APIs or tables does that change touch besides the obvious one?
  tech_lead: On {key} ({summary}), what is the part most likely to go wrong, and how would you check it?
  qa: On {key} ({summary}), which existing behaviour would you retest because of it?
  product_owner: On {key} ({summary}), who on the business side is waiting for it, and what will they look at first?
  bsa: On {key} ({summary}), which business rule does it depend on, and where is that rule written down?
  scrum_master: On {key} ({summary}), what would make this story slip, and who would you talk to first?
