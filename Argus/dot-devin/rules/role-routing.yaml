# Job-role routing for Acme Claims sessions.
#
# Devin Cloud's own roles (admin / member / read-only) are a permission model. They say what a
# person is allowed to do in the platform; they say nothing about what that person does for a
# living. This file carries the second half: the delivery roles the Acme Claims team actually uses, and
# what each of them should get by default — which lens, which skills, which playbooks, which
# shape of answer.
#
# Read this together with:
#   .devin/rules/people.yaml        who holds which roles (the roster)
#   .devin/rules/dashboard-roles.yaml  which dashboard panels a role sees (`dashboard_lens`)
#   .devin/rules/approval-gates.yaml   which roles can sign which gate (`gate_roles`)
#
# HARD RULE — routing is not access control. A role in this file never grants or denies
# permission. Every real restriction comes from Devin Cloud roles, Bitbucket branch protection,
# secret scoping and the approval gates. `action_class` below only shapes default behaviour and
# the tone of the first response; it is not a security boundary.

version: 1

# ---------------------------------------------------------------------------------------------
# Roster governance. Drift is the main risk to this whole mechanism, so ownership is explicit.
# ---------------------------------------------------------------------------------------------
governance:
  roster_file: .devin/rules/people.yaml
  # The roster resolver and the people who can act for them are named in the people.yaml owner
  # block; that file, not this one, is the single place ownership is recorded.
  owner: people.yaml owner.primary
  backups: people.yaml owner.backups
  change_process: >-
    Any role change is a pull request against .devin/rules/people.yaml, reviewed by the roster
    owner or one of the named backups. Nobody edits their own entry without a second reviewer.
  review_cadence: quarterly
  drift_check: >-
    /roster-check runs weekly and compares the roster against Acme Claims Jira membership, raising a
    pull request when it finds joiners, leavers or incomplete entries.
  how_to: sdlc/framework/ROSTER-GOVERNANCE.md

# ---------------------------------------------------------------------------------------------
# How the role for a session is chosen. People wear several hats; the hat is picked per request,
# not per person.
# ---------------------------------------------------------------------------------------------
selection:
  precedence:
    - id: explicit
      rule: The requester names the hat in the session ("I'm wearing the QA lead hat today").
    - id: invoked
      rule: >-
        The requester invoked a skill or playbook that belongs to exactly one role
        (default_skills / default_playbooks below); that role applies.
    - id: hints
      rule: >-
        A role_hints keyword in people.yaml matches the request. Only hats the person already
        holds may be matched this way — a keyword never invents a role.
    - id: primary
      rule: Fall back to the person's primary_role.
    - id: ask
      rule: >-
        If two or more held hats match equally and the action_class differs between them, ask
        which one applies rather than guessing.
  announce: >-
    State the chosen hat in one short line before starting work ("Treating this as QA lead work
    — say so if that is wrong"), then get on with it. Do not re-announce on every reply.
  conflict_rule: >-
    When held hats disagree on action_class, the most restrictive one wins until the requester
    says otherwise (read_only < advisory < code_pr < release).
  unknown_person: >-
    No roster match: continue as a guest, read_only. Say once, in the first reply:
    "I am continuing with you as a guest. You can do all read-only lookups; for more than that, talk to the solution lead."
    Then answer the question. Do not ask for their role and do not offer a roster pull request.
  switching: >-
    A requester may change hats mid-session. Behaviour changes; permissions do not.

# ---------------------------------------------------------------------------------------------
# What each action class means in practice. Behavioural defaults only.
# ---------------------------------------------------------------------------------------------
action_classes:
  read_only:
    default: Answer, explain, summarise. Do not write repository files.
  advisory:
    default: >-
      May write session artefacts and knowledge-base drafts under
      sdlc/framework/context/session/{OWNER}/, never application source.
  code_pr:
    default: May change application source and raise a pull request; never push to master.
  release:
    default: >-
      May prepare promotion and rollback plans and run the release stage; the promotion itself
      still waits on SDLC_07.

# ---------------------------------------------------------------------------------------------
# The roles. `aliases` are what people actually type or say; `gate_roles` are the role names
# approval-gates.yaml understands, so a job role stays connected to the gate model.
# ---------------------------------------------------------------------------------------------
# Who gets each skill. A role's default_skills are its first commands (the top of /help and of Argus's My
# tools menu, at most eight); more_skills are the rest of that role's My tools; everyone_skills are on every role's
# My tools. internal_skills run inside another skill or an automation, so nobody is given them; the app-, db- and
# etl- documentation stages and the older names are internal too. The Skill config tab on the Tech Lead dashboard
# shows every skill against these lists and turns ticks into a change to this file (tools/skill_homes.py).
everyone_skills: [start, status, approve, send-approval, handover, resume-session, identify-requester, help, catalogue, learn-more, vacation, argus, workbench, devin-window]
internal_skills:
  app-domain-context: loaded by every documentation stage before it runs
  app-cross-pipeline: runs at the end of /kb-build all


roles:
