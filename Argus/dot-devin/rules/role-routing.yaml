# ---------------------------------------------------------------------------------------------
# Argus screen per dashboard lens (console/server.py load_layouts, sent with /api/me).
#   list         the ticket list the left column opens on (a scope of the "My work" select)
#   left, right  open = full column; rail = collapsed to a thin bar the person can open;
#                auto = rail until a run is open or something is waiting for a signature
#   right_width  width of the right column in px when it is open
# The Backlog screen always takes the full width. A person's own open/rail choice is kept on
# their PC and wins over these defaults. Layout only; it grants no access.
# ---------------------------------------------------------------------------------------------
workbench_layouts:
  developer:
    list: mine_sprint
    left: open
    right: open
    right_width: 420
  tech_lead:
    list: sprint
    left: open
    right: open
    right_width: 480
  architect:
    list: open
    left: open
    right: open
    right_width: 420
  automation:
    list: automation
    left: open
    right: open
    right_width: 380
  qa:
    list: qa
    left: open
    right: open
    right_width: 380
  uat:
    list: uat
    left: open
    right: auto
    right_width: 380
  bsa:
    list: open
    left: open
    right: auto
    right_width: 380
  po_office:
    list: open
    left: open
    right: auto
    right_width: 380
  scrum_master:
    list: sprint
    left: open
    right: auto
    right_width: 380
  release:
    list: uat
    left: open
    right: open
    right_width: 420

# Legacy role names kept in people.yaml and approval-gates.yaml, mapped onto the roles above so
# neither file has to be rewritten in one go.
role_aliases:
  tech_lead: solution_lead
  lead_developer: solution_lead
  dev_team: developer
  test_lead: qa_lead
  qa_engineer: qa_staff
  tester: qa_staff
  automation_tester: automation_engineer
  sdet: automation_engineer
  po: product_owner
  po_office: product_owner
  delivery_lead: lead
  programme_manager: manager
  ops_release_manager: release_manager
  solution_architect: architect
  principal_engineer: architect

default_role: developer
