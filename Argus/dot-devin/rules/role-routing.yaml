    label: Delivery lead
    aliases: [delivery lead, team lead, engineering lead]
    dashboard_lens: po_office
    gate_roles: []
    action_class: advisory
    systems: [jira, bitbucket, confluence, bamboo]
    output: status_summary_then_decisions
    default_skills: [dashboard, pi-plan, sprint-review-summary, spec-vs-delivery, roster-check, gate-review, loe]
    more_skills: [status-report, product-roadmap, jira-hygiene, defects-by-specialty]
    default_playbooks: [PB-27-pi-plan, PB-24-sprint-review-summary, PB-38-gate-review, PB-34-roster-check]

  solution_lead:
    label: Solution lead
    aliases: [solution lead, tech lead, technical lead]
    dashboard_lens: tech_lead
    gate_roles: [tech_lead]
    action_class: code_pr
    systems: [jira, bitbucket, sonarqube, confluence]
    output: options_with_trade_offs
    default_skills: [dashboard, plan, grooming-assistant, story-splitter, pr-readiness, document-validation, adr, loe]
    more_skills: [research, sdlc, run-app-locally, export-jira, build-check, kb-refresh, product-roadmap, jira-hygiene, defects-by-specialty, roster-sync, gate-timeout-check, source-staleness-check, team-insights]
    default_playbooks: [PB-04-plan-and-routing, PB-13-grooming-assistant, PB-12-pr-readiness, PB-37-adr, PB-03-bottom-up-research, PB-05-source-staleness-check, PB-11-story-splitter, PB-32-document-validation, PB-36-build-check]

