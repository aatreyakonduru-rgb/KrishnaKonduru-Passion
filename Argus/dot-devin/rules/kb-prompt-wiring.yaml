# Which skill, pipeline or script runs each shared prompt in sdlc/kb/kb-prompts/.
# Checked by sdlc/framework/tools/tests/test_kb_wiring.py: every prompt is listed once,
# every skill named here runs (or, for runners, follows) that prompt file, every pipeline named
# here lists the skill as a stage, and no script-built file is also written by a prompt.
#
# class:
#   stage      a skill renders and runs the prompt; `pipeline` is the skill that calls it in order
#   on_demand  a skill runs it when a person asks (one requirement, one drift check); no pipeline
#   generator  a kbgen script writes the file; the prompt is the spec and self-check list for it,
#              and for teams that don't have the script. No skill may render it to write the file.
#   runner     the stage order and gates, followed by a pipeline skill
#   helper     run by a pipeline skill around the stages

standard: PROMPT_STANDARD.md   # read by every prompt (listed in each prompt's `requires`)

prompts:
  CTX-00: {file: PROMPT_0_MODULE_INDEX.md, class: stage, skill: kb-context-build, pipeline: kb-context-build}
  CTX-0A: {file: PROMPT_0A_BUSINESS_MODEL.md, class: stage, skill: kb-context-build, pipeline: kb-context-build}
  CTX-0B: {file: PROMPT_0B_TECHNOLOGY_STACK.md, class: stage, skill: kb-context-build, pipeline: kb-context-build}
  CTX-0C: {file: PROMPT_0C_DATA_ARCHITECTURE.md, class: stage, skill: kb-context-build, pipeline: kb-context-build}
  CTX-0D: {file: PROMPT_0D_JOB_ORCHESTRATION.md, class: stage, skill: kb-context-build, pipeline: kb-context-build}
  CTX-0E: {file: PROMPT_0E_TEAM_GLOSSARY.md, class: stage, skill: kb-context-build, pipeline: kb-context-build}
  APP-01: {file: PROMPT_1_DISCOVERY.md, class: stage, skill: app-discovery, pipeline: app-run-pipeline}
  APP-02: {file: PROMPT_2_BUSINESS_REQUIREMENTS.md, class: stage, skill: app-brd, pipeline: app-run-pipeline}
  APP-03: {file: PROMPT_3_FUNCTIONAL_REQUIREMENTS.md, class: stage, skill: app-frd, pipeline: app-run-pipeline}
  APP-04: {file: PROMPT_4_TECHNICAL_REQUIREMENTS.md, class: stage, skill: app-trd, pipeline: app-run-pipeline}
  APP-05: {file: PROMPT_5_USER_MANUAL.md, class: stage, skill: app-user-manual, pipeline: app-run-pipeline}
  APP-06: {file: PROMPT_6_PROCESS_DOCUMENTATION.md, class: stage, skill: app-process-docs, pipeline: app-run-pipeline}
  APP-07: {file: PROMPT_7_DIAGRAMS.md, class: stage, skill: app-diagrams, pipeline: app-run-pipeline}
  APP-08: {file: PROMPT_8_VALIDATION_LOG_UPDATE.md, class: stage, skill: app-validation-log, pipeline: app-run-pipeline}
  APP-09: {file: PROMPT_9_SECURITY_REVIEW.md, class: stage, skill: app-security-review, pipeline: app-run-pipeline}
  APP-10: {file: PROMPT_10_ENDPOINT_REGISTRY.md, class: generator, generator: sdlc/framework/tools/kbgen/gen_api_kb.py, checked_by: kb-build}
  APP-11: {file: PROMPT_11_API_DATA_CONTRACTS.md, class: generator, generator: sdlc/framework/tools/kbgen/gen_api_kb.py, checked_by: kb-build}
  APP-12: {file: PROMPT_12_COMPONENT_REGISTRY.md, class: generator, generator: sdlc/framework/tools/kbgen/gen_ui_kb.py, checked_by: kb-build}
  APP-13: {file: PROMPT_13_UI_TO_DATA_FIELD_MAPPING.md, class: stage, skill: app-ui-data-mapping, pipeline: app-run-pipeline}
  APP-14: {file: PROMPT_14_VALIDATION_RULES_CATALOGUE.md, class: stage, skill: app-validation-rules, pipeline: app-run-pipeline}
  APP-15: {file: PROMPT_15_UI_SPECIFICATION.md, class: stage, skill: app-ui-spec, pipeline: app-run-pipeline}
  APP-16: {file: PROMPT_16_MODULE_IO_SUMMARY.md, class: stage, skill: app-module-io, pipeline: app-run-pipeline}
  APP-17: {file: PROMPT_17_INTEGRATION_SCENARIOS.md, class: stage, skill: app-integration, pipeline: app-run-pipeline}
