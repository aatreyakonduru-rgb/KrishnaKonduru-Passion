  DB-03: {file: DB_PROMPT_3_TRD.md, class: stage, skill: db-trd, pipeline: db-run-pipeline}
  DB-04: {file: DB_PROMPT_4_DIAGRAMS.md, class: stage, skill: db-diagrams, pipeline: db-run-pipeline}
  DB-05: {file: DB_PROMPT_5_SUPPORTING.md, class: stage, skill: db-supporting, pipeline: db-run-pipeline}
  DB-06: {file: DB_PROMPT_6_SECURITY.md, class: stage, skill: db-security, pipeline: db-run-pipeline}
