  DB-12: {file: DB_PROMPT_12_AI_GUARDRAILS.md, class: stage, skill: db-guardrails, pipeline: db-run-pipeline}
  DB-13: {file: DB_PROMPT_13_ENTITY_REGISTRY.md, class: stage, skill: db-entity-registry, pipeline: db-run-pipeline}
  DB-14: {file: DB_PROMPT_14_APP_VERIFIED_QUERIES.md, class: stage, skill: db-app-queries, pipeline: db-run-pipeline}
  DB-15: {file: DB_PROMPT_15_AI_VALIDATION_TESTS.md, class: stage, skill: db-ai-tests, pipeline: db-run-pipeline}
  DB-16: {file: DB_PROMPT_16_CROSS_MODULE_MATRIX.md, class: stage, skill: db-cross-module, pipeline: db-run-pipeline}
  DB-SD: {file: DB_PROMPT_STALENESS_DETECTION.md, class: on_demand, skill: app-knowledge-refresh}
  ETL-01: {file: ETL_PROMPT_1_DISCOVERY.md, class: stage, skill: etl-discovery, pipeline: etl-run-pipeline}
  ETL-02: {file: ETL_PROMPT_2_BUSINESS_REQUIREMENTS.md, class: stage, skill: etl-brd, pipeline: etl-run-pipeline}
  ETL-03: {file: ETL_PROMPT_3_FUNCTIONAL_REQUIREMENTS.md, class: stage, skill: etl-frd, pipeline: etl-run-pipeline}
  ETL-04: {file: ETL_PROMPT_4_TECHNICAL_REQUIREMENTS.md, class: stage, skill: etl-trd, pipeline: etl-run-pipeline}
  ETL-05: {file: ETL_PROMPT_5_USER_MANUAL.md, class: stage, skill: etl-operator-manual, pipeline: etl-run-pipeline}
  ETL-06: {file: ETL_PROMPT_6_PROCESS_DOCUMENTATION.md, class: stage, skill: etl-runbooks, pipeline: etl-run-pipeline}
  ETL-07: {file: ETL_PROMPT_7_ARCHITECTURE_DIAGRAMS.md, class: stage, skill: etl-diagrams, pipeline: etl-run-pipeline}
