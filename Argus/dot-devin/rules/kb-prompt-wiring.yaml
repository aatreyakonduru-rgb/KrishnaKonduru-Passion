  RUN-APP: {file: KB_RUNNER_APP.md, class: runner, followed_by: app-run-pipeline}
  RUN-DB: {file: KB_RUNNER_DB.md, class: runner, followed_by: db-run-pipeline}
  RUN-ETL: {file: KB_RUNNER_ETL.md, class: runner, followed_by: etl-run-pipeline}
  HELP-CODEDOC: {file: DETAILED_CODE_DOCUMENTATION.md, class: stage, skill: app-code-docs, pipeline: app-run-pipeline}   # optional stage
  HELP-SESSION: {file: SESSION_MANAGER.md, class: helper, skill: app-run-pipeline}

# Files two prompts both write, and how they share them.
shared_outputs:
  - path: "{{KB_MODULE_DOCS}}/{{MODULE_NAME}}/SESSION_STATE.md"
    writers: [HELP-SESSION, APP-08]
    rule: HELP-SESSION starts it at the beginning of a run; APP-08 updates the same file and never starts a new one.

# Top-level entry points and what they call, in order.
entry_points:
  kb-build: [kb-context-build, app-run-pipeline, etl-run-pipeline, db-run-pipeline, db-cross-module, app-cross-pipeline]

# Smallest set of stages to re-run for each kind of change. Carried over from the archived
# prompt-pipeline guide (section 11, "Refresh Cascade Rules"), with its old numbers mapped to
# the current prompt IDs. /app-knowledge-refresh lists these as the suggested follow-up.
refresh_cascade:
  new_db_table: [DB-01, DB-03, DB-09, DB-09B, DB-13, DB-16]
  new_db_column_on_contracted_table: [DB-01, DB-09, DB-09B, DB-16]
  new_code_value: [DB-01, DB-05, DB-09, DB-13]
  new_api_endpoint: [APP-01, APP-03, APP-10, APP-11]
  new_ui_component: [APP-01, APP-03, APP-12]
  new_etl_script: [ETL-01, ETL-03, ETL-12, ETL-13]
