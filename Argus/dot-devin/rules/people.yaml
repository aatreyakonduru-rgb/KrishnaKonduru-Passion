# Acme Claims people roster — who is who, and which hats they wear.
#
# Two kinds of role live on each person:
#   roles          gate roles. These must match required_role / approvers[].role values in
#                  .devin/rules/approval-gates.yaml and the lens `roles` lists in
#                  .devin/rules/dashboard-roles.yaml. Changing one of these changes who can
#                  sign a gate, so treat it as a controlled field.
#   primary_role   the job role from .devin/rules/role-routing.yaml used to shape a session
#   secondary_roles  the other hats the same person legitimately wears
#   role_hints     keywords that select one of this person's own secondary hats for a request
#
# Routing is not access control: primary_role and secondary_roles never grant permission. Real
# restrictions come from Devin Cloud roles, Bitbucket branch protection and the approval gates.
#
#   access         which gate roles may change which folders (longest path wins, `any` = anyone on
#                  the roster, {owner} = the person's own session folder), and the gates the
#                  requester may not sign, and (roster_signoff) whose sign-off of the roster page
#                  unlocks them in each gates.mode: owner, backup, or a gate role the signer
#                  holds. A pending roster unlocks nothing. Devin's write hook, the git pre-commit check and the
#                  gates read it (tools/access_guard.py). It is a guard against mistakes inside
#                  Devin; Bitbucket approvals are the hard control.
#
# Other fields:
#   email          work address, used to match the requester from chat or git identity
#   devin_user_id  Devin Cloud user id, when known — the most reliable match of all
#   jira_user      Jira username; null means the person cannot be matched to a gate yet
#   delegate_to    Jira username that receives this person's approvals while they are away
#   allocation     percentage of a full sprint this person is available for, from the resource
#                  list. Absent means 100. Only the sprint workload panel reads it.
#   delivery       false for someone who carries no sprint work of their own — the manager and
#                  the roster steward. Absent means true.
#
# Keeping it accurate: /roster-check compares this file against Jira weekly and raises a pull
# request when it finds drift. See sdlc/framework/ROSTER-GOVERNANCE.md.

