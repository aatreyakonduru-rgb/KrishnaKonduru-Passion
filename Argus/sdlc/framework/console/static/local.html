<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local Devin</title>
<style>
  :root { --brand: #4a1fb8; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --soft: #f5f3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--brand); color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
  header b { font-size: 16px; }
  header .who { opacity: .9; }
  header .grow { flex: 1; }
  header a { color: #fff; }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 300px; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside .bar { padding: 10px; display: flex; gap: 8px; border-bottom: 1px solid var(--line); }
  aside ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  aside li { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  aside li:hover { background: var(--soft); }
  aside li.on { background: #ede9fe; }
  aside li.closed { opacity: .5; }
  aside li .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside li .s { color: var(--muted); font-size: 12px; }
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  #head .grow { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #arts { padding: 6px 16px; border-bottom: 1px solid var(--line); display: none; gap: 8px; flex-wrap: wrap; background: #fafafa; }
  #arts a { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; text-decoration: none; color: var(--brand); }
  #log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 820px; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; }
  .msg.devin { align-self: flex-start; background: #f3f4f6; }
  .msg.local { align-self: center; background: #ecfdf5; border: 1px solid #a7f3d0; }
  .msg.error { align-self: center; background: #fef2f2; border: 1px solid #fecaca; }
  .msg a { color: inherit; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: vertical; min-height: 44px; max-height: 240px; padding: 10px; font: inherit; border: 1px solid #d1d5db; border-radius: 8px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.ghost { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  .hint { color: var(--muted); font-size: 12px; padding: 0 16px 10px; }
  .empty { color: var(--muted); margin: auto; text-align: center; }
</style>
</head>
<body>
<header>
  <b>Local Devin</b><span class="who" id="who"></span><span class="grow"></span>
  <span id="state"></span>
</header>
<main>
  <aside>
    <div class="bar"><button id="new" type="button">New session</button><button id="reload" class="ghost" type="button">Refresh</button></div>
    <ul id="list"></ul>
  </aside>
  <section>
    <div id="head"><span class="grow" id="title">New session</span>
      <a id="open" target="_blank" rel="noopener" style="display:none">Open in Devin</a>
      <button id="close" class="ghost" type="button" style="display:none">Close session</button></div>
    <div id="arts"></div>
    <div id="log"><div class="empty" id="empty">Type a command below. <b>/argus</b> and <b>/dashboard</b> open here in your browser; anything else goes to Devin Cloud.</div></div>
    <form id="form">
      <textarea id="text" placeholder="/dashboard, /argus, /status {{PROJECT}}-1234, or any request for Devin…"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <div class="hint" id="hint">Enter sends, Shift+Enter adds a line. /help lists the commands that run on this PC.</div>
  </section>
</main>
<script>
(function () {
  var current = null, timer = null, notes = [];
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
  function api(method, url, body) {
    var opt = { method: method, headers: { "X-Local-Devin": "1" } };
    if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
    return fetch(url, opt).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error || r.statusText); } return j; });
    });
  }
  function bubble(kind, text) {
    $("empty") && $("empty").remove();
    var d = document.createElement("div");
    d.className = "msg " + kind;
    d.innerHTML = linkify(text);
    $("log").appendChild(d);
    $("log").scrollTop = $("log").scrollHeight;
  }
  function note(kind, text) { notes.push({ kind: kind, text: text }); bubble(kind, text); }

  function loadList() {
    api("GET", "/api/sessions").then(function (d) {
      var ul = $("list"); ul.innerHTML = "";
      d.sessions.forEach(function (s) {
        var li = document.createElement("li");
        li.className = (s.session_id === current ? "on " : "") + (s.closed ? "closed" : "");
        li.innerHTML = '<div class="t">' + esc(s.title) + '</div><div class="s">' + esc(s.status) + " · " + esc((s.updated || "").replace("T", " ").slice(0, 16)) + "</div>";
        li.onclick = function () { select(s.session_id); };
        ul.appendChild(li);
      });
      if (!d.sessions.length) { ul.innerHTML = '<li class="s">No sessions yet.</li>'; }
    }).catch(function (e) { $("state").textContent = e.message; });
  }

  function render(d) {
    $("title").textContent = d.title || d.session_id;
    $("open").href = d.url; $("open").style.display = d.url ? "" : "none";
    $("close").style.display = "";
    $("state").textContent = d.status;
    var log = $("log"); log.innerHTML = "";
    d.messages.forEach(function (m) { bubble(m.source === "devin" ? "devin" : "user", m.text); });
    notes.forEach(function (n) { bubble(n.kind, n.text); });
    var arts = $("arts"); arts.innerHTML = "";
    d.artefacts.forEach(function (a) {
      if (!a.url) { return; }
      var l = document.createElement("a"); l.href = a.url; l.target = "_blank"; l.rel = "noopener"; l.textContent = a.name;
      arts.appendChild(l);
    });
    arts.style.display = d.artefacts.length ? "flex" : "none";
  }

  function poll() {
    if (!current) { return; }
    var id = current;
    api("GET", "/api/sessions/" + encodeURIComponent(id)).then(function (d) { if (id === current) { render(d); } })
      .catch(function (e) { $("state").textContent = e.message; });
  }

  function select(id) {
    current = id; notes = [];
    clearInterval(timer);
    $("log").innerHTML = "";
    poll(); timer = setInterval(poll, 5000);
    loadList();
  }

  function fresh() {
    current = null; notes = []; clearInterval(timer);
    $("title").textContent = "New session"; $("open").style.display = "none"; $("close").style.display = "none";
    $("arts").style.display = "none"; $("state").textContent = "";
    $("log").innerHTML = '<div class="empty" id="empty">Type a command below. <b>/argus</b> and <b>/dashboard</b> open here in your browser; anything else goes to Devin Cloud.</div>';
    loadList();
  }

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var text = $("text").value.trim();
    if (!text) { return; }
    $("send").disabled = true;
    var local = /^\/(workbench|console|dashboard|help)\b/.test(text);
    if (local) { note("user", text); } else if (current) { bubble("user", text); }
    if (/^\/dashboard\b/.test(text)) { note("local", "Building your dashboard…"); }
    api("POST", "/api/command", { text: text, session_id: local ? "" : (current || "") }).then(function (r) {
      $("text").value = "";
      if (r.kind === "local") { note("local", r.text); return; }
      if (r.kind === "created") { select(r.session_id); if (r.text) { note("local", r.text); } return; }
      poll();
    }).catch(function (e) { note("error", e.message); })
      .then(function () { $("send").disabled = false; $("text").focus(); });
  });
  $("text").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit(); }
  });
  $("new").onclick = fresh;
  $("reload").onclick = function () { loadList(); poll(); };
  $("close").onclick = function () {
    if (!current || !confirm("Close this Devin session for good? It cannot be woken again.")) { return; }
    api("POST", "/api/sessions/" + encodeURIComponent(current) + "/close").then(fresh)
      .catch(function (e) { note("error", e.message); });
  };

  api("GET", "/api/config").then(function (c) {
    $("who").textContent = c.user ? "as " + c.user.name : "(start with --user <your e-mail>)";
    if (!c.devin_configured) { $("state").textContent = "DEVIN_API_KEY is not set"; }
    else if (!c.jira_configured) { $("state").textContent = "No Jira key on this PC: /dashboard is built in Devin Cloud; Argus has no Jira ticket lists"; }
  });
  loadList();
  $("text").focus();
}());
</script>
</body>
</html>
