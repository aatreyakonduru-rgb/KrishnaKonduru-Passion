# Sample team roster: who is who, and which roles they hold for the SDLC approval gates.
# Every person is a placeholder (Resource 1, Resource 2, ...). Replace them with your own team;
# keep the role names, which must match .devin/rules/approval-gates.yaml, role-routing.yaml and
# dashboard-roles.yaml.
#
#   jira_user        Jira username; owner, backups and delegate_to point at it
#   email            work address, used to recognise the person in chat and git
#   devin_user_id    Devin user id, when known
#   roles            gate roles: which approvals this person may sign
#   primary_role     job role that shapes a Devin session for this person
#   secondary_roles  other hats the same person wears
#   role_hints       words that pick one of the secondary hats for a request
#   delegate_to      who gets this person's approvals while they are away
#   allocation       % of a sprint they are available (absent = 100)
#   delivery         false for people with no sprint work of their own (absent = true)
#
#   access           which gate roles may change which folders of your repository. The longest
#                    matching path wins; `any` is anyone on the roster; {owner} is the person's own
#                    session folder; default_roles covers every path no area lists. Gates named in
#                    no_self_approval cannot be signed by the person who asked for the change. The
#                    paths below are examples: use your own code, knowledge-base and framework folders.
#                    roster_signoff says, per gates.mode, whose sign-off of the roster page unlocks
#                    guarded writes and gate sign-offs: owner, backup, or a gate role the signer holds.
#
# If your roster lives on a wiki page, the source: block names that page; tools/roster_sync.py
# regenerates this file from it.

